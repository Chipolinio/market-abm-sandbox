[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-abm"
version = "0.1.0"
description = "Econometric ABM e-commerce market simulator (DOD / Polars)"
readme = "specs/001-synthetic-population.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5",
    "numpy>=2.0",
    "polars>=1.0",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: long-run stability tests (50 ticks, tracemalloc)",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-abm"
version = "0.1.0"
description = "Econometric ABM e-commerce market simulator (DOD / Polars)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5",
    "fastapi>=0.100",
    "numpy>=2.0",
    "polars>=1.0",
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = ["catboost>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "slow: long-run stability tests (50 ticks, tracemalloc)",
    "ml: ML-repricing slice tests (Spec 005); may require optional 'ml' extra",
    "worker: integration tests that spawn real multiprocessing.Process (Spec 006)",
    "docker: Docker Compose smoke tests (Spec 007); require docker CLI",
]
